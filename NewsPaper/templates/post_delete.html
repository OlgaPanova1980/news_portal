{% extends 'flatpages/default.html' %}

{% block title %}
Удаление публикации
{% endblock title %}

{% block content %}
<div class="container mt-4">
    <h1>Удалить публикацию</h1>
    <hr>
    <form action="" method="post">
        {% csrf_token %}
        <p>Вы уверены, что хотите безвозвратно удалить "{{ object.title }}"?</p>
        <input type="submit" value="Подтвердить удаление" class="btn btn-danger" />
    </form>
</div>
{% endblock content %}
