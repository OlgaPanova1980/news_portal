<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock title %}</title>
    <!-- Подключаем стили Bootstrap напрямую из интернета для красоты -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body>
    <!-- Черная шапка сайта (навигационная панель) -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/news/">Django Tutorial (News)</a>
        </div>
    </nav>

    <!-- Сюда Django будет автоматически вставлять контент из news.html и news_detail.html -->
    <div class="container mt-4">
        {% block content %}
        {% endblock content %}
    </div>
</body>
</html>
